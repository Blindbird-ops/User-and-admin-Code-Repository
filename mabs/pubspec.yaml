name: mabs
description: "A new Flutter project."
publish_to: 'none' #

version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.3.0
  firebase_core: ^2.31.0
  firebase_database: ^10.5.5
  intl: ^0.20.0
  shared_preferences: ^2.0.15
  google_fonts: ^6.2.1
  cloudinary_public: ^0.23.1
  image_picker: ^0.8.4+3
  confetti: ^0.7.0
  flutter_launcher_icons: ^0.13.1 # add this
  firebase_auth: ^4.19.4
  awesome_notifications: ^0.10.1 
  permission_handler: ^11.3.0
  cloud_functions: ^4.7.6
  url_launcher: ^6.3.2
  firebase_messaging: ^14.9.4
  showcaseview: ^5.0.1
  lottie: ^3.3.2
  video_player: ^2.10.1
  dropdown_search: ^6.0.2
  camera: ^0.11.3+1
  firebase_storage: ^11.7.7
  cached_network_image: ^3.4.0
  sensors_plus: ^6.0.0
  geolocator: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # To add assets to your application, add an assets section below.
  
  assets:
    - assets/images/LOGO transparent.png
    - assets/icons/business_clearance.png
    - assets/icons/barangay_indigent.png
    - assets/icons/certification_late_registration.png
    - assets/icons/clearance.png
    - assets/icons/certification.png
    - assets/icons/cohabitation.png
    - assets/icons/seaweeds.png
    - assets/images/barangay_hall.png
    - assets/images/request_documents.png
    - assets/animations/guide.json
    - assets/videos/tutorial.mp4
    - assets/json/provinces.json
    - assets/json/municipalities.json
    - assets/json/barangays.json


flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/logo.png   # 1024x1024 PNG (no rounded corners)

